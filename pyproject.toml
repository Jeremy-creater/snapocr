[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapocr"
version = "0.0.1"
description = "Personal tray screenshot tool: capture, OCR and local-LLM translation to clipboard"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/snapocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running local model service (Ollama)",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["snapocr"]
branch = true
