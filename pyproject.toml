[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapocr"
version = "0.0.1"
description = "Personal tray screenshot tool: capture, OCR and local-LLM translation to clipboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Built-in OCR engine (PRD §5): in-process PP-OCR models via ONNX Runtime.
    # Pinned to 3.10.x because the bundled model file names change between versions.
    "rapidocr>=3.10,<3.11",
    "onnxruntime>=1.31,<2",
    # Imported directly by snapocr.engines.rapidocr_engine (already transitive
    # deps of rapidocr; declared because directly imported packages must be).
    "numpy>=2,<3",
    "opencv-python-headless>=4.5,<6",
    # GUI shell (PRD section 5). Essentials only: QtWidgets/QtGui cover tray,
    # overlay, clipboard and screens; the full PySide6 adds WebEngine/Addons.
    "PySide6-Essentials>=6.12,<6.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "pytest-qt>=4.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/snapocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running local model service (Ollama)",
    "engine: loads the real in-process RapidOCR models (no external service)",
    "perf: latency measurements; manual only, never part of a gate",
    "gui: needs a real Windows desktop (tray, hotkeys, screen capture); manual, run with --qt-desktop",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["snapocr"]
branch = true
# snapocr.gui.platform needs the real desktop; it is covered by the manual gui lane
# (coverage-gui.toml), not by unit/engine (CLAUDE.md, M2 plan D11).
omit = ["*/snapocr/gui/platform/*"]
