# PRD F22-5, F24-5: build the Windows and Mac portable zips. On a v* tag: lanes, build, self-check
# the unzipped program, then attach both zips to one draft Release that Jeremy publishes by hand.
# Run by hand (workflow_dispatch): the same, but the zips only become build artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Tag matches the version
        if: github.ref_type == 'tag'
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but pyproject.toml says $version" }

      - name: unit lane
        run: python -m pytest -m "not integration and not engine and not perf and not gui" -q
      - name: engine lane
        run: python -m pytest -m "engine and not perf and not gui" -q

      - name: Build
        id: build
        run: |
          python packaging/build.py --out "$env:RUNNER_TEMP\build"
          $zip = Get-ChildItem "$env:RUNNER_TEMP\build\*.zip" | Select-Object -First 1
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Self-check the unzipped exe (F22-4)
        run: |
          $dir = "$env:RUNNER_TEMP\unzipped"
          Expand-Archive "${{ steps.build.outputs.zip }}" $dir
          foreach ($name in "snapocr.exe", "LICENSE", "THIRD_PARTY_NOTICES.md", "README.txt") {
            if (-not (Test-Path "$dir\snapocr\$name")) { throw "missing snapocr\$name in the zip" }
          }
          $report = "$env:RUNNER_TEMP\selfcheck.json"
          $p = Start-Process "$dir\snapocr\snapocr.exe" -ArgumentList "--self-check", "$env:GITHUB_WORKSPACE\tests\fixtures\en.png", $report -Wait -PassThru
          Get-Content $report -Encoding utf8
          $r = Get-Content $report -Raw -Encoding utf8 | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $r.ok -or -not $r.frozen -or $r.text -notmatch "quick brown fox") { throw "self-check failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.zip }}
          compression-level: 0
          retention-days: 14

  macos-zip:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Tag matches the version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} but pyproject.toml says $version"; exit 1; }

      - name: unit lane
        run: python -m pytest -m "not integration and not engine and not perf and not gui" -q
      - name: engine lane
        run: python -m pytest -m "engine and not perf and not gui" -q

      - name: Build
        id: build
        run: |
          python packaging/build.py --out "$RUNNER_TEMP/build"
          zip=$(ls "$RUNNER_TEMP"/build/*.zip | head -n 1)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$zip")" >> "$GITHUB_OUTPUT"

      - name: Self-check the unzipped app (F24-4)
        run: |
          dir="$RUNNER_TEMP/unzipped"
          ditto -x -k "${{ steps.build.outputs.zip }}" "$dir"
          for name in README.txt snapocr.app/Contents/Resources/LICENSE snapocr.app/Contents/Resources/THIRD_PARTY_NOTICES.md; do
            test -e "$dir/$name" || { echo "missing $name in the zip"; exit 1; }
          done
          codesign --verify --deep --strict "$dir/snapocr.app"
          report="$RUNNER_TEMP/selfcheck.json"
          "$dir/snapocr.app/Contents/MacOS/snapocr" --self-check "$GITHUB_WORKSPACE/tests/fixtures/en.png" "$report"
          cat "$report"
          python -c "import json, sys; r = json.load(open(sys.argv[1], encoding='utf-8')); sys.exit(not (r['ok'] and r['frozen'] and 'quick brown fox' in r['text']))" "$report"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.zip }}
          compression-level: 0
          retention-days: 14

  # One job after both builds, so a Release never holds only one of the zips.
  draft-release:
    if: github.ref_type == 'tag'
    needs: [windows-zip, macos-zip]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" zips/*.zip --clobber
          else
            gh release create "$tag" zips/*.zip --draft --verify-tag --title "snapocr ${tag#v}" --notes "See CHANGELOG.md."
          fi
