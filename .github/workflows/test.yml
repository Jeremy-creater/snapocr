# PRD F21-7: the unit and engine lanes on Windows. integration (needs Ollama),
# gui (needs a real desktop) and perf stay manual on the developer's machine (CLAUDE.md).
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lanes:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: unit lane
        run: python -m pytest -m "not integration and not engine and not perf and not gui" -q
      - name: engine lane
        run: python -m pytest -m "engine and not perf and not gui" -q
