# Coverage settings for the manual gui lane only (CLAUDE.md, M2 plan D11).
# Same as pyproject.toml but without the omit of snapocr.gui.platform.
[tool.coverage.run]
source = ["snapocr"]
branch = true
# The Mac files are covered by the gui-mac lane (coverage-gui-mac.toml; M9 plan D11).
omit = ["*/snapocr/gui/platform/mac/*"]
